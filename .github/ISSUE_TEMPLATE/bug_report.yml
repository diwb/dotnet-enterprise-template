name: Bug report
description: Report a reproducible defect.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve this template.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact commands, requests or configuration.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: ".NET SDK, OS, Docker version, SQL Server version"
    validations:
      required: true
