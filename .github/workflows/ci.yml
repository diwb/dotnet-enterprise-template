name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DotNetEnterpriseTemplate.slnx
      - run: dotnet build DotNetEnterpriseTemplate.slnx --configuration Release --no-restore
      - run: dotnet test DotNetEnterpriseTemplate.slnx --configuration Release --no-build --verbosity normal
