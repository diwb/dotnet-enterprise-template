name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: codeql analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - run: dotnet restore DotNetEnterpriseTemplate.slnx
      - run: dotnet build DotNetEnterpriseTemplate.slnx --configuration Release --no-restore

      - uses: github/codeql-action/analyze@v3
